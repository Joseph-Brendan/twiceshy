packages:
  - 'packages/*'
  - 'examples/*'

# better-sqlite3 12.x runs prebuild-install, which downloads a prebuilt binary
# for the current platform and Node release and only falls back to node-gyp
# when no prebuild exists. Allowing the script keeps the prebuilt path working
# on every supported Node 22 and Node 24 release, including 22.13.
# esbuild's postinstall only places its prebuilt binary; no compiler needed.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
