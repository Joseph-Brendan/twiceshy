name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        node-version: [22, 24]

    steps:
      - name: Configure git autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve exact Node.js version
        id: node-version
        shell: bash
        run: echo "exact=$(node -p 'process.version.slice(1)')" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: pnpm --use-node-version=${{ steps.node-version.outputs.exact }} typecheck

      - name: Lint
        run: pnpm --use-node-version=${{ steps.node-version.outputs.exact }} lint

      - name: Test
        run: pnpm --use-node-version=${{ steps.node-version.outputs.exact }} test

      - name: Build
        run: pnpm --use-node-version=${{ steps.node-version.outputs.exact }} build

      - name: Check package
        run: pnpm --use-node-version=${{ steps.node-version.outputs.exact }} check:package
