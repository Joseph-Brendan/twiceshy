name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }} (better-sqlite3 ${{ matrix.better-sqlite3 }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        # Every supported better-sqlite3 major. 12 is the floor; 13 is latest.
        # The weekly canary covers majors that do not exist yet.
        better-sqlite3: ['12', '13']

    steps:
      - name: Configure git autocrlf
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The manifests keep the universally compatible 12.x for local work; the
      # matrix proves every major works, including 13.
      - name: Use better-sqlite3 ${{ matrix.better-sqlite3 }}
        shell: bash
        run: |
          FLAGS=""
          if [ "${{ matrix.better-sqlite3 }}" = "13" ]; then
            # 13 ships ready-made N-API binaries in the tarball and has no
            # install script. pnpm's build allowlist would still run node-gyp
            # for it, which fails on the Windows runners' Visual Studio
            # version. 12 does need its prebuild-install script.
            FLAGS="--ignore-scripts"
          fi
          pnpm --filter twiceshy add -D better-sqlite3@^${{ matrix.better-sqlite3 }} $FLAGS
          pnpm --filter @twiceshy/mcp-proxy add better-sqlite3@^${{ matrix.better-sqlite3 }} $FLAGS

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Build before Test so the real-binary tests (P9/P11) never race two
      # parallel test workers against one dist folder.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check package
        run: pnpm check:package

      - name: Pack and install test
        run: pnpm test:pack

      - name: Smoke test
        env:
          TWICESHY_SMOKE_BETTER_SQLITE3: ${{ matrix.better-sqlite3 }}
        run: pnpm test:smoke
