name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 05:00 UTC.
    - cron: '0 5 * * 1'

jobs:
  mutation:
    name: Stryker on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve exact Node.js version
        id: node-version
        shell: bash
        run: echo "exact=$(node -p 'process.version.slice(1)')" >> "$GITHUB_OUTPUT"

      - name: Run mutation tests
        run: pnpm --use-node-version=${{ steps.node-version.outputs.exact }} test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
